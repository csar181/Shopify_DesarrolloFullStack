spring.application.name=shopcloud

# PostgreSQL (las credenciales se leen de variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopcloud_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Zona horaria de negocio (vigencia de suscripciones y descuentos)
app.zona-horaria=America/Lima

# Servidor
app.cors.allowed-origin=http://localhost:5173
server.port=8080
